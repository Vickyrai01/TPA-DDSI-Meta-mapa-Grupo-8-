<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaMapa</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<header class="site-header" id="top">
  <div class="container nav">
    <a class="brand" href="#top">
      <span class="pin">📍</span>
      <span class="brand-text">MetaMapa</span>
    </a>

    <nav class="menu">
      <a href="#inicio">INICIO</a>
      <a href="#reportar" class="active">REPORTAR SUCESO</a>
      <a href="#mapa">VER MAPA</a>
      <a href="#navegar">NAVEGAR SUCESOS</a>
      <a href="#perfil" class="avatar" aria-label="Perfil">
        <i class="fa-regular fa-user"></i>
      </a>
    </nav>

    <button class="burger" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section id="inicio" class="hero" style="display:none;"> <div class="hero-inner container">
    <h1 class="hero-title">
      <span class="pin">📍</span> MetaMapa
    </h1>
    <p class="hero-subtitle">La ciudad te habla, nosotros te avisamos.</p>
    <div class="about-card">
      <h2 class="card-title">Quiénes somos</h2>
      <p class="card-body">
        MetaMapa es un Sistema de código abierto...
      </p>
    </div>
  </div>
  </section>

  <section id="reportar" class="report-section">
    <div class="container report-container">

      <form class="report-card" autocomplete="off">
        <div class="report-header">REPORTAR SUCESO</div>

        <label class="field half">
          <span>Título suceso</span>
          <input type="text" placeholder="">
        </label>

        <label class="field half">
          <span>Categoría</span>
          <select>
            <option value="" selected>Elegí una categoría</option>
            <option>Incendio</option>
            <option>Corte de calle</option>
            <option>Inundación</option>
            <option>Seguridad</option>
            <option>Otro</option>
          </select>
        </label>

        <label class="field half">
          <span>Descripción</span>
          <input type="text" placeholder=""> </label>

        <label class="field half">
          <span>Fecha de suceso</span>
          <input type="date">
        </label>

        <a href="#" class="attach-link">Adjuntar multimedia</a>

        <button class="btn-primary btn-blue" type="submit">REPORTAR</button>
      </form>
    </div>
  </section>
</main>
h
<script src="script.js" defer></script>
</body>
</html>
