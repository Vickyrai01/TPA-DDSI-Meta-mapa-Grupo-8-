<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MetaMapa - Reportar</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/pages-css/reportarSuceso.css">
  <link rel="stylesheet" href="../css/pages-css/navbar.css">
  <link rel="stylesheet" href="../css/pages-css/footer.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- NAVBAR -->
<header class="site-header" id="top">
  <div class="container nav">
    <a class="brand" href="#top">
      <img src="../img/logoNAVBAR.png" alt="Logo MetaMapa" class="brand-logo">
    </a>

    <nav class="menu">
      <a href="#inicio">Inicio</a>
      <a href="#reportar"  style="color: #ff8c42">Reportar suceso</a>
      <a href="#mapa">Ver mapa</a>
      <a href="#navegar">Navegar sucesos</a>
      <a href="#perfil" class="avatar" aria-label="Perfil">
        <i class="fa-regular fa-user"></i>
      </a>
    </nav>

    <button class="burger" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>


<main>

  <section id="reportar" class="report-section">
    <div class="container report-container">

      <form class="report-card" autocomplete="off">
        <div class="report-header">REPORTAR SUCESO</div>

        <label class="field half">
          <span>Título suceso</span>
          <input type="text" placeholder="">
        </label>

        <label class="field half">
          <span>Categoría</span>
          <select>
            <option value="" selected>Elegí una categoría</option>
            <option>Incendio</option>
            <option>Corte de calle</option>
            <option>Inundación</option>
            <option>Seguridad</option>
            <option>Otro</option>
          </select>
        </label>

        <label class="field half">
          <span>Descripción</span>
          <input type="text" placeholder=""> </label>

        <label class="field half">
          <span>Fecha de suceso</span>
          <input type="date">
        </label>

        <div class="field half">
          <span>Adjuntar evidencias</span>
          <div class="attach-row">
            <label for="evidencias" class="file-btn">
              <i class="fa-solid fa-paperclip" aria-hidden="true"></i> Adjuntar
            </label>
            <span id="evidencias-name" class="file-name"></span>
          </div>
          <input id="evidencias" type="file" accept="image/*,video/*">
        </div>

        <button class="btn-primary" type="submit">Reportar</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <a href="mailto:metamapa@gmail.com"><i class="fa-solid fa-envelope"></i> metamapa@gmail.com</a>
    <a href="#mapa"><i class="fa-solid fa-map-location-dot"></i> /ver-mapa</a>
    <a href="https://instagram.com" target="_blank" rel="noreferrer"><i class="fa-brands fa-instagram"></i> @metamapa</a>
  </div>
</footer>

<script src="script.js" defer></script>
</body>
</html>
