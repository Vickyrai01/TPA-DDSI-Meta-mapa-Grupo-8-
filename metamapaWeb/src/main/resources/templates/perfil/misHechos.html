<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Mis Hechos</title>
  <link rel="stylesheet" th:href="@{/css/pages-css/misHechos.css}">
</head>
<body>
<div class="mis-hechos-container">
  <h2>Mis Hechos</h2>
  <div th:if="${#lists.isEmpty(misHechos)}">
    <p>No has reportado ningún hecho todavía.</p>
  </div>
  <div th:if="${!#lists.isEmpty(misHechos)}">
    <ul class="mis-hechos-list">
      <li th:each="h : ${misHechos}">
        <div class="hecho-title" th:text="${h.nombre}">Título del hecho</div>
        <div class="hecho-desc" th:text="${h.descripcion}">Descripción</div>
        <div class="hecho-fecha">Fecha: <span th:text="${h.fechaSuceso}">Fecha</span></div>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
