<div th:fragment="sidebarPerfil">
    <button onclick="cerrarSidebarPerfil()" style="position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:2rem;cursor:pointer">&times;</button>
    <aside class="sidebar-perfil">
        <div class="perfil-header">
            <img th:src="${foto}" alt="Foto de perfil" class="perfil-foto" style="width:100px;border-radius:50%;">
            <h2 th:text="${nombre}">Nombre</h2>
            <p th:text="${email}">email</p>
        </div>
        <div class="perfil-datos">
            <!-- Puedes agregar más datos aquí si lo deseas -->
        </div>
    </aside>
    <style>
        .sidebar-perfil-content {
            position: fixed;
            top: 0;
            right: 0;
            width: 350px;
            height: 100vh;
            background: #fff;
            box-shadow: -2px 0 16px rgba(0,0,0,0.12);
            z-index: 1101;
            padding: 2rem 1.5rem;
            overflow-y: auto;
            transition: right 0.3s;
        }
        .sidebar-perfil-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.25);
            z-index: 1100;
        }
        .sidebar-perfil {
            width: 100%;
        }
        .perfil-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .perfil-foto {
            margin-bottom: 1rem;
        }
        .perfil-datos {
            font-size: 1rem;
            color: #444;
        }
    </style>
</div>
