<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          titulo='Solicitud eliminación',
          linksAdicionales=~{:: #links-de-solicitud},
          scriptsAdicionales=~{:: #scripts-de-solicitud},
          contenido=~{:: #contenido-de-solicitud}
      )}">

<!-- CSS específicos de esta vista -->
<th:block id="links-de-solicitud">
    <link rel="stylesheet" th:href="@{/css/pages-css/solicitudEliminacion.css}">
    <link rel="stylesheet" th:href="@{/css/pages-css/button.css}">
</th:block>

<th:block id="scripts-de-solicitud">
    <script th:src="@{/js/solicitudEliminacion.js}" defer></script>
</th:block>


<!-- CONTENIDO principal que irá dentro de <main> del layout -->
<div id="contenido-de-solicitud" class="hero">
    <div class="hero-inner container">
        <div class="modal-card">
            <div class="modal-header">Solicitud eliminación</div>
            <div class="modal-body">
                <div class="info-group">
                    <label><strong>Título:</strong> Intento de robo de mochila</label>
                </div>
                <div class="info-group">
                    <label><strong>Descripción:</strong> Le robaron la mochila a una persona, la policía agarró al ladrón y la mochila fue rescatada.</label>
                </div>
                <div class="info-group">
                    <label><strong>Categoría:</strong> Intento de robo.</label>
                </div>
                <div class="info-group">
                    <label><strong>Fecha suceso:</strong> 28/07/2025</label>
                </div>

                <!-- Si luego querés postear, podés usar th:action y method="post" -->
                <form th:action="@{/solicitudes/eliminacion}" method="post" autocomplete="off">
                    <div class="form-group">
                        <label for="motivo"><strong>Motivo solicitud</strong></label>
                        <textarea id="motivo" name="motivo" placeholder="Escribe el motivo de tu solicitud..." maxlength="1000"></textarea>
                        <div class="char-count">0/1000</div>
                    </div>

                    <button class="btn-solicitar" type="submit">Solicitar</button>
                </form>
            </div>
        </div>
    </div>
</div>

</html>
