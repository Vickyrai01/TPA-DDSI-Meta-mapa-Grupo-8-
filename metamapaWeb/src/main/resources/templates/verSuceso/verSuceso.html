<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MetaMapa</title>

    <!-- Fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Estilos (misma carpeta) -->
    <link rel="stylesheet" href="../css/button.css">
    <link rel="stylesheet" href="../css/footer.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../home/style.css">
    <!-- <CHANGE> Agregado archivo CSS separado para la página de detalles -->
    <link rel="stylesheet" href="styles.css">

    <!-- (Opcional) Iconos para footer -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<!-- NAV -->
<header class="site-header" id="top">
    <div class="container nav">
        <a class="brand" href="#top">
            <img src="../../static/img/logoNAVBAR.png" alt="Logo MetaMapa" class="brand-logo">
        </a>

        <nav class="menu">
            <a href="#inicio">Inicio</a>
            <a href="#reportar">Reportar suceso</a>
            <a href="#mapa">Ver mapa</a>
            <a href="#navegar">Navegar sucesos</a>
            <a href="#perfil" class="avatar" aria-label="Perfil">
                <i class="fa-regular fa-user"></i>
            </a>
        </nav>

        <button class="burger" aria-label="Abrir menú">
            <span></span><span></span><span></span>
        </button>
    </div>
</header>

<!-- <CHANGE> Contenido principal con layout de dos columnas -->
<main class="robbery-details-container">
    <!-- Mapa a la izquierda -->
    <div class="map-section">
        <div class="map-placeholder"></div>
    </div>

    <!-- Barra lateral a la derecha -->
    <aside class="details-sidebar">
        <div class="sidebar-header">
            <h1>Intento de robo de mochila</h1>
        </div>

        <div class="sidebar-content">
            <!-- Descripción -->
            <div class="form-group">
                <label>Descripción</label>
                <p class="card-body">
                    Le robaron la mochila a una persona, la policía agarro al ladrón y la mochila fue <rescatada class=""></rescatada>
                </p>
            </div>

            <!-- Categoría -->
            <div class="form-group">
                <label>Categoría</label>
                <p class="card-body"> Intento de robo </p>
            </div>

            <!-- Fecha suceso -->
            <div class="form-group">
                <label>Fecha suceso</label>
                <p class="card-body"> 28/07/2025 </p>
            </div>

            <!-- Link de eliminación -->
            <a href="#" class="delete-link">Solicitar eliminación</a>
        </div>
    </aside>
</main>

<!-- FOOTER -->
<footer class="site-footer">
    <div class="container footer-grid">
        <a href="mailto:metamapa@gmail.com"><i class="fa-solid fa-envelope"></i> metamapa@gmail.com</a>
        <a href="#mapa"><i class="fa-solid fa-map-location-dot"></i> /ver-mapa</a>
        <a href="https://instagram.com" target="_blank" rel="noreferrer"><i class="fa-brands fa-instagram"></i> @metamapa</a>
    </div>
</footer>

<!-- Script (misma carpeta) -->
<script src="../scripts/home/script.js" defer></script>
</body>
</html>
