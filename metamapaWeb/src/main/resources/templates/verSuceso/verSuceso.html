<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          titulo='Mapa',
          linksAdicionales=~{:: #links-de-mapa},
          scriptsAdicionales=~{:: #scripts-de-mapa},
          contenido=~{:: #contenido-de-mapa}
      )}">

<th:block id="links-de-mapa">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>

    <link rel="stylesheet" th:href="@{/css/pages-css/verSuceso.css}">
</th:block>


<div id="contenido-de-mapa">
    <div class="map-section">
        <div class="map-panel" id="mapa"></div>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    </div>

    <!-- Mostrar multimedia si existe -->
    <div th:if="${hechos != null}">
        <div th:each="hecho : ${hechos}">
            <div>
                <div th:if="${hecho.multimedia != null and !hecho.multimedia.isEmpty()}">
                    <div th:each="media : ${hecho.multimedia}">
                        <img th:src="@{'/uploads/' + ${media}}" alt="Evidencia" style="max-width: 400px; max-height: 300px; margin: 10px 0;"/>
                    </div>
                </div>
                <div th:if="${hecho.multimedia == null or hecho.multimedia.isEmpty()}">
                    <p style="color: #888; font-style: italic;">No tiene fotos adjuntas.</p>
                </div>
            </div>
        </div>
    </div>
</div>



<th:block id="scripts-de-mapa">

    <script th:inline="javascript">
        /*<![CDATA[*/
        const hechos = /*[[${hechos}]]*/ [];

        // Obtenemos el ID de la colección que nos pasó el controlador
        const coleccionId = /*[[${coleccionId}]]*/ null;

        console.log("Datos para el mapa:", hechos); // (Para verificar en la consola F12)
        /*]]>*/
    </script>

    <script th:src="@{/js/verSuceso.js}" defer></script>
</th:block>

</html>
