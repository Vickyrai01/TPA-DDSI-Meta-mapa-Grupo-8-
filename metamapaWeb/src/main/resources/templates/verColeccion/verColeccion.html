<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          titulo=${coleccion.titulo()},
          linksAdicionales=~{:: #links-de-coleccion},
          scriptsAdicionales=~{:: #scripts-de-coleccion},
          contenido=~{:: #contenido-de-coleccion}
      )}">

<!-- ========== CSS (inline para probar) ========== -->
<th:block id="links-de-coleccion">
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --brand:#ff8c42;
            --text:#222;
            --muted:#6b7280;
            --bg:#fff;
            --line:#e5e7eb;
            --grey: #a8a8a8;
        }
        /* ---- Layout responsive ---- */
        .map-layout-container{
            display:grid;
            grid-template-columns:minmax(0,1fr) 380px;
            gap:1.25rem;
            width:100%;
            min-height: calc(100vh - 160px); /* ocupa toda la pantalla menos navbar+footer */
        }
        .map-panel{
            height:100%;
            border:1px solid var(--line);
            border-radius:16px;
            overflow:hidden;
            background:#f8fafc;
        }
        .sidebar-panel{
            height: 100%;
            overflow: auto;
        }
        .sidebar-header{font-weight:800;letter-spacing:.06em;color:var(--brand);margin-bottom:.25rem;margin-top: .75rem;}
        .sidebar-content h2{margin:.25rem 0 .5rem 0}

        @media (max-width: 1100px){
            .map-layout-container{grid-template-columns:minmax(0,1fr) 320px}
        }
        @media (max-width: 900px){
            .map-layout-container{grid-template-columns:1fr}
            .sidebar-panel{max-height:unset}
            .map-panel{height:clamp(360px, 50vh, 600px)}
        }

        /* ---- Acordeón ---- */
        .hechos-accordion details{
            background:var(--bg);
            border:1px solid var(--line);
            border-radius:14px;
            padding:.75rem 1rem;
            margin:.6rem 0;
            box-shadow:0 1px 2px rgba(0,0,0,.05);
            transition:box-shadow .15s,border-color .15s;
            margin-right: 1.25rem;
        }
        .hechos-accordion details:hover{box-shadow:0 4px 14px rgba(0,0,0,.07); border-color:#d1d5db}
        .hechos-accordion details[open]{border-color:var(--brand); box-shadow:0 6px 20px rgba(255,140,66,.15)}
        .hechos-accordion summary{
            display:flex; align-items:flex-start; justify-content:space-between; gap:.75rem; cursor:pointer; list-style:none;
        }
        .hechos-accordion summary::-webkit-details-marker{display:none}
        .hecho-title{font-weight:700; color:var(--text)}
        .hecho-meta{color:var(--muted); font-size:.9rem; white-space:nowrap}
        .chev{color:var(--brand); margin-left:.5rem; transition: transform .2s}
        details[open] .chev{transform:rotate(90deg)}
        .hecho-detalle{
            display: flex;
            flex-direction: column;
            gap: 0.6rem; /* controla el espacio entre los bloques */
            margin-top: 0.5rem;
        }
        .field{
            display: flex;
            flex-direction: column;
        }
        /* Etiqueta (atributo) */
        .field-label{
            font-weight: 600;
            color: var(--dark, #1f2937);
            margin-bottom: 0.15rem; /* separa el label del valor */
        }
        /* Valor */
        .field-value{
            color: var(--text, #374151);
            line-height: 1.4;
        }
        /* Valor “sin dato” */
        .field-value.muted{
            color:var(--muted);
            font-style:italic;
        }
        .field:not(:last-child) {
            border-bottom: 1px dashed var(--grey, #e5e7eb);
            padding-bottom: 0.5rem;
        }
        .muted{color:var(--muted)}
        .chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.35rem 0}
        .chip{background:#f3f4f6;border:1px solid #e5e7eb;border-radius:999px;padding:.15rem .55rem;font-size:.85rem}
        .media-list{display:flex;flex-wrap:wrap;gap:.45rem;margin:.3rem 0}
        .media-list a{display:inline-flex;align-items:center;gap:.35rem;text-decoration:none;color:#374151;font-size:.92rem}
        .media-list a:hover{color:#111827}
        .btn-map{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:.35rem .6rem;cursor:pointer;text-decoration:none;}
        .btn-map:hover{filter:brightness(.95)}
        .popup-card .btn-map{
            display:inline-flex;
            align-items:center;
            gap:.4rem;
            background:#ff8c42;
            color:#fff;
            border-radius:10px;
            padding:.35rem .6rem;
            text-decoration:none;
        }
        .popup-card .btn-map:hover{
            filter:brightness(.95);
        }
        .hechos-accordion details.highlight{
            border-color: var(--brand);
            box-shadow: 0 0 0 2px rgba(255,140,66,0.22);
        }
        /* 1) Aumentá la especificidad de tus reglas */
        .field > .field-label{
            font-weight: 600;
            color: var(--dark, #1f2937);
            margin-bottom: 0.15rem;
        }

        .field > .field-value{
            font-weight: 400;
            color: #374151; /* valor */
            line-height: 1.4;
        }

        /* estado “sin dato” */
        .field > .field-value.muted{
            color: var(--muted);
            font-style: italic;
        }
    </style>


</th:block>

<!-- ========== CONTENIDO ========== -->
<div id="contenido-de-coleccion">
    <main class="map-layout-container">
        <div id="mapa" class="map-panel"></div>

        <aside class="sidebar-panel">
            <header class="sidebar-header">COLECCIÓN</header>
            <section class="sidebar-content">
                <h2 th:text="${coleccion.titulo()}">Título colección</h2>
                <p th:text="${coleccion.descripcionColeccion()}">Descripción</p>

                <h3 style="margin-top:1rem">Hechos</h3>
                <div class="hechos-accordion">

                    <!-- Acordeón por hecho -->
                    <details th:each="h : ${hechos}"
                             th:attr="data-hash=${h.hash()}, data-lat=${h.latitud()}, data-lon=${h.longitud()}">

                        <!-- Solo título en el summary -->
                        <summary>
                            <div class="hecho-title" th:text="${h.nombre()}">Título del hecho</div>
                            <i class="chev fa-solid fa-chevron-right" aria-hidden="true"></i>
                        </summary>

                        <!-- Todo el resto dentro del detalle -->
                        <div class="hecho-detalle">

                            <!-- Descripción -->
                            <div class="field">
                                <span class="field-label">Descripción:</span>
                                <span class="field-value"
                                      th:text="${h.descripcion()!=null ? h.descripcion() : 'No indica'}"
                                      th:classappend="${h.descripcion()==null} ? 'muted' : ''">
                                </span>
                            </div>

                            <!-- Fecha del hecho -->
                            <div class="field">
                                <span class="field-label">Fecha del hecho:</span>
                                <span class="field-value"
                                      th:text="${h.fechaSuceso()!=null ?
                        #dates.format(#dates.parse(h.fechaSuceso(),'yyyy-MM-dd'),'dd/MM/yyyy') :
                        'No indica'}"
                                      th:classappend="${h.fechaSuceso()==null} ? 'muted' : ''">
                                </span>
                            </div>

                            <!-- Fecha de carga -->
                            <div class="field">
                                <span class="field-label">Fecha de carga:</span>
                                <span class="field-value"
                                      th:text="${h.fechaCarga()!=null ?
                                        #dates.format(#dates.parse(h.fechaCarga(),'yyyy-MM-dd'),'dd/MM/yyyy') :
                                        'No indica'}"
                                      th:classappend="${h.fechaSuceso()==null} ? 'muted' : ''">
                                </span>
                            </div>

                            <!-- Etiquetas -->
                            <div class="field">
                                <span class="field-label">Etiquetas:</span>

                                <!-- Cuando hay etiquetas -->
                                <span class="field-value" th:if="${h.etiquetas()!=null and !#lists.isEmpty(h.etiquetas())}">
                                    <span class="chip" th:each="tag : ${h.etiquetas()}" th:text="${tag}"></span>
                                </span>

                                <!-- Cuando no hay -->
                                <span class="field-value muted" th:if="${h.etiquetas()==null or #lists.isEmpty(h.etiquetas())}">
                                    No indica
                                </span>
                            </div>

                            <!-- Contribuyente -->
                            <div class="field">
                                <span class="field-label">Contribuyente:</span>
                                <span class="field-value"
                                      th:text="${h.contribuyente()!=null ? h.contribuyente() : 'No indica'}"
                                      th:classappend="${h.contribuyente()==null} ? 'muted' : ''">
                                </span>
                            </div>

                            <!-- Multimedia -->
                            <div class="field" th:if="${h.multimedia()!=null and !h.multimedia().isEmpty()}">
                                <span class="field-label">Multimedia:</span>
                                <span class="field-value">
                                    <a th:each="m : ${h.multimedia()}" th:href="${m}" target="_blank" rel="noreferrer">
                                         <i class="fa-solid fa-link"></i><span th:text="${#strings.abbreviate(m, 30)}">Archivo</span>
                                    </a>
                                </span>
                            </div>

                            <!-- Botón Ver en mapa -->
                            <div class="field" style="margin-top:0.6rem;">
                                <a href="#" class="btn-map js-ver-hecho" th:attr="data-hash=${h.hash()}">
                                    <i class="fa-solid fa-location-dot"></i> Ver hecho
                                </a>
                            </div>

                        </div>
                    </details>

                    <p th:if="${#lists.isEmpty(hechos)}" class="muted">No hay hechos para esta colección.</p>
                </div>
            </section>
        </aside>
    </main>
</div>

<!-- ========== JS (inline para probar) ========== -->
<th:block id="scripts-de-coleccion">
    <!-- Datos del backend -->
    <!-- 1) Debe estar antes para inyectar la lista de hechos -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        window.hechos = /*[[${hechos}]]*/ [];
        /*]]>*/
    </script>

    <!-- 2) Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <!-- 3) JS principal -->
    <script>
        // ===== Helpers menores =====
        const toNum = v => {
            if (v == null) return null;
            const n = parseFloat(String(v).replace(',', '.'));
            return Number.isFinite(n) ? n : null;
        };

        // ===== Datos para el mapa =====
        const puntos = (window.hechos || [])
            .map(h => ({
                hash: h.hash,
                nombre: h.nombre,
                lat: toNum(h.latitud),
                lon: toNum(h.longitud)
            }))
            .filter(p => p.lat != null && p.lon != null);

        // ===== Mapa =====
        const defaultCenter = [-34.6037, -58.3816], defaultZoom = 11;
        const map = L.map('mapa', { maxZoom: 19 })
            .setView(puntos.length ? [puntos[0].lat, puntos[0].lon] : defaultCenter,
                puntos.length ? 13 : defaultZoom);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
        }).addTo(map);

        // ===== Marcadores + popup con "Ver hecho" =====
        const markersByHash = {};
        puntos.forEach(p => {
            const popupHtml = `
      <div class="popup-card">
        <div class="popup-title"><b>${p.nombre ?? '(sin título)'}</b></div>
        <a href="#" class="btn-map js-ver-hecho" data-hash="${p.hash}">
          <i class="fa-solid fa-list"></i> Ver hecho
        </a>
      </div>
    `;
            const m = L.marker([p.lat, p.lon]).addTo(map).bindPopup(popupHtml);
            markersByHash[p.hash] = m;
        });

        // Al abrir cualquier popup: solo centramos suave (NO tocamos la sidebar)
        map.on('popupopen', (e) => {
            const ll = e.popup.getLatLng();
            //map.flyTo(ll, Math.max(map.getZoom(), 15), { duration: .4 });
        });

        // ===== Helpers de sincronización mapa <-> sidebar =====
        const sidebarPanel = document.querySelector('.sidebar-panel');

        function focusMarker(hash, {zoom=15, openPopup=true} = {}) {
            const m = markersByHash[hash];
            if (!m) return;
            const latlng = m.getLatLng();
            map.flyTo(latlng, Math.max(map.getZoom(), zoom), { duration: .45 });
            if (openPopup) m.openPopup();
        }

        function openDetails(hash, {scroll=true, highlight=true, closeOthers=true} = {}) {
            const details = document.querySelector(`details[data-hash="${hash}"]`);
            if (!details) return;

            if (closeOthers) {
                document.querySelectorAll('.hechos-accordion details[open]')
                    .forEach(d => { if (d !== details) d.removeAttribute('open'); });
            }
            details.setAttribute('open', true);

            if (highlight) {
                document.querySelectorAll('.hechos-accordion details')
                    .forEach(d => d.classList.remove('highlight'));
                details.classList.add('highlight');
            }
            if (scroll && sidebarPanel) {
                sidebarPanel.scrollTo({ top: details.offsetTop - 40, behavior: 'smooth' });
            }
        }

        // ===== Solo cuando tocan "Ver hecho" en el popup =====
        document.addEventListener('click', (e) => {
            const link = e.target.closest('.js-ver-hecho');
            if (!link) return;

            e.preventDefault();
            const hash = link.dataset.hash;

            // 1) Centrar mapa y mantener popup abierto
            focusMarker(hash, { openPopup: true });

            // 2) Abrir acordeón correspondiente, cerrar otros y scrollear
            openDetails(hash);
        });

        // ===== Ajustes de layout/leaflet opcionales =====
        function fitLayout(){
            const header = document.querySelector('header.site-header');
            const footer = document.querySelector('footer.site-footer');
            const cont   = document.querySelector('.map-layout-container');
            if(!cont) return;
            const h = window.innerHeight - (header?.offsetHeight||0) - (footer?.offsetHeight||0) - 16;
            cont.style.minHeight = Math.max(360, h) + 'px';
        }
        window.addEventListener('load',  () => { fitLayout(); setTimeout(()=>map.invalidateSize(), 80); });
        window.addEventListener('resize',() => { fitLayout(); map.invalidateSize(); });
    </script>
</th:block>

</html>
