<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout(
          titulo=${coleccion.titulo()},
          linksAdicionales=~{:: #links-de-coleccion},
          scriptsAdicionales=~{:: #scripts-de-coleccion},
          contenido=~{:: #contenido-de-coleccion}
      )}">

<!-- ========== CSS ========== -->
<th:block id="links-de-coleccion">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/pages-css/verColeccion.css}">
</th:block>

<!-- ========== CONTENIDO ========== -->
<div id="contenido-de-coleccion">
    <main class="map-layout-container">
        <div id="mapa" class="map-panel"></div>
        <aside class="sidebar-panel">
            <header class="sidebar-header">COLECCIÓN</header>
            <section class="sidebar-content">
                <h2 th:text="${coleccion.titulo()}">Título colección</h2>
                <p th:text="${coleccion.descripcionColeccion()}">Descripción</p>

                <!-- ARREGLO: poner bien data-id en el selector -->
                <div>
                    <label for="selectorModo">Modo de navegación:</label>
                    <select id="selectorModo" th:attr="data-id=${coleccion.id()}">
                        <option value="CURADA" th:selected="${modoActual == 'CURADA'}">Curada</option>
                        <option value="IRRESTRICTA" th:selected="${modoActual == 'IRRESTRICTA'}">Irrestricta</option>
                    </select>
                </div>

                <div class="filtros-bloque" style="margin-bottom:1em;">
                    <button type="button" class="btn-toggle-filtros" aria-expanded="false">Filtros</button>
                    <form class="filtros-form" style="display:none;" id="form-filtros" autocomplete="off">
                        <div class="filtro-item">
                            <label for="titulo">Título:</label>
                            <input type="text" name="titulo" id="titulo" placeholder="Buscar por título">
                        </div>
                        <div class="filtro-item">
                            <label for="descripcion">Descripción:</label>
                            <input type="text" name="descripcion" id="descripcion" placeholder="Buscar por descripción">
                        </div>
                        <div class="filtro-item">
                            <label for="etiqueta">Etiquetas:</label>
                            <select id="etiqueta" name="etiqueta">
                                <option value="">- Todas -</option>
                                <option value="accidente">Accidente</option>
                                <option value="fraude">Fraude</option>
                                <option value="delito">Delito</option>
                            </select>
                        </div>
                        <div class="filtro-item">
                            <label for="categoria">Categoría:</label>
                            <select id="categoria" name="categoria">
                                <option value="">- Todas -</option>
                                <option value="ciberestafa">Ciberestafa</option>
                                <option value="colision-en-ruta">Colisión en la ruta</option>
                                <option value="venta-fraudulenta">Venta fraudulenta con cheques</option>
                            </select>
                        </div>
                        <div class="filtro-item" style="margin-bottom:.3em;">
                            <span style="font-weight: bold; color: #a8732e;">Fecha de suceso</span>
                        </div>
                        <div class="filtro-item">
                            <label for="fechaDesdeSuceso">Desde:</label>
                            <input type="date" name="fechaDesdeSuceso" id="fechaDesdeSuceso">
                        </div>
                        <div class="filtro-item">
                            <label for="fechaHastaSuceso">Hasta:</label>
                            <input type="date" name="fechaHastaSuceso" id="fechaHastaSuceso">
                        </div>
                        <div class="filtro-item" style="margin-bottom:.3em; margin-top:.8em;">
                            <span style="font-weight: bold; color: #a8732e;">Fecha de carga</span>
                        </div>
                        <div class="filtro-item">
                            <label for="fechaDesdeCarga">Desde:</label>
                            <input type="date" name="fechaDesdeCarga" id="fechaDesdeCarga">
                        </div>
                        <div class="filtro-item">
                            <label for="fechaHastaCarga">Hasta:</label>
                            <input type="date" name="fechaHastaCarga" id="fechaHastaCarga">
                        </div>
                        <div class="filtro-item">
                            <label for="provincia">Provincia / Localidad:</label>
                            <select name="provincia" id="provincia">
                                <option value="">- Todos -</option>
                                <option value="caba">CABA</option>
                                <option value="cordoba">Córdoba</option>
                                <option value="buenos-aires">Buenos Aires</option>
                                <option value="mendoza">Mendoza</option>
                            </select>
                        </div>
                        <div class="filtro-item">
                            <label>
                                <input type="checkbox" name="soloMultimedia"> Solo hechos con archivos/imágenes
                            </label>
                        </div>
                        <div style="margin-top:.7rem">
                            <button type="submit" class="btn-map" style="width:100%">Filtrar</button>
                        </div>
                    </form>
                </div>

                <h3 style="margin-top:1rem">Hechos</h3>
                <div id="hechos-accordion" class="hechos-accordion"></div>
                <p id="msg-sin-hechos" class="muted" style="display:none;">No hay hechos para esta colección.</p>
            </section>
        </aside>
    </main>
</div>

<!-- ========== JS con AJAX ========== -->
<th:block id="scripts-de-coleccion">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const API_BASE = 'http://localhost:8081/core/api';
        let map, markersByHash = {};

        document.addEventListener('DOMContentLoaded', () => {
            const defaultCenter = [-34.6037, -58.3816], defaultZoom = 11;
            const mapaEl = document.getElementById('mapa');
            if (mapaEl) {
                map = L.map(mapaEl, { maxZoom: 19 }).setView(defaultCenter, defaultZoom);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
                }).addTo(map);
            }

            document.querySelector('.btn-toggle-filtros')?.addEventListener('click', function(){
                const form = document.getElementById('form-filtros');
                if (!form) return;
                const open = form.style.display === 'block';
                form.style.display = open ? 'none' : 'block';
                this.setAttribute('aria-expanded', !open);
            });

            document.getElementById('form-filtros')?.addEventListener('submit', async function(e){
                e.preventDefault();
                await traerYRenderizarHechos();
            });

            document.getElementById('selectorModo')?.addEventListener('change', async function(){
                await traerYRenderizarHechos();
            });

            document.addEventListener('click', function(e){
                const link = e.target.closest('.js-ver-hecho');
                if (!link) return;
                e.preventDefault();
                const hash = link.dataset.hash;
                if (map && markersByHash[hash]) {
                    map.setView(markersByHash[hash].getLatLng(), Math.max(map.getZoom(), 15), { duration: .45 });
                    markersByHash[hash].openPopup();
                }
                const details = document.querySelector(`details[data-hash="${hash}"]`);
                if (details) {
                    document.querySelectorAll('.hechos-accordion details[open]').forEach(d=>d.removeAttribute('open'));
                    details.setAttribute('open','true');
                }
            });

            traerYRenderizarHechos();
        });

        async function traerYRenderizarHechos() {
            const modoSel = document.getElementById('selectorModo');
            const coleccionId = modoSel ? modoSel.dataset.id : null;
            // DEBUG para vos: fijate si esto sale bien en consola
            console.log("coleccionId:", coleccionId, "modoSel.value:", modoSel.value);

            if (!coleccionId) {
                // Si no hay coleccionId, no sigue
                console.error("No se encontró data-id en el select.");
                renderHechos([]);
                return;
            }

            const modo = modoSel ? modoSel.value : 'CURADA';
            const form = document.getElementById('form-filtros');
            const params = new URLSearchParams();
            Array.from(form.elements).forEach(el => {
                if (!el.name) return;
                if ((el.type === "checkbox" && el.checked) || (el.type !== "checkbox" && el.value)) {
                    params.append(el.name, el.value);
                }
            });
            const url = `${API_BASE}/colecciones/${coleccionId}/${modo}/hechos?${params.toString()}`;
            console.log("URL de fetch:", url); // DEBUG para que lo veas

            try {
                const res = await fetch(url);
                if (!res.ok) {
                    console.warn("API no respondió ok:", res.status);
                    renderHechos([]);
                    return;
                }
                const hechos = await res.json();
                renderHechos(hechos);
            } catch (err) {
                console.error("Error en fetch:", err);
                renderHechos([]);
            }
        }

        function renderHechos(hechos) {
            const accordion = document.getElementById('hechos-accordion');
            const msgSinHechos = document.getElementById('msg-sin-hechos');
            if (!accordion) return;

            accordion.innerHTML = '';
            msgSinHechos.style.display = hechos.length ? 'none' : 'block';

            if (map && markersByHash) {
                Object.values(markersByHash).forEach(m => map.removeLayer(m));
                markersByHash = {};
            }

            let p0 = null;
            hechos.forEach(h => {
                const detalles = document.createElement('details');
                detalles.setAttribute('data-hash', h.hash ?? '');
                detalles.setAttribute('data-lat', h.latitud ?? '');
                detalles.setAttribute('data-lon', h.longitud ?? '');

                const resumen = document.createElement('summary');
                resumen.innerHTML = `<div class="hecho-title">${h.nombre ?? "(sin título)"}</div>
                                     <i class="chev fa-solid fa-chevron-right"></i>`;
                detalles.appendChild(resumen);

                const detalle = document.createElement('div');
                detalle.classList.add('hecho-detalle');
                detalle.innerHTML += `<div class="field"><span class="field-label">Descripción:</span>
                    <span class="field-value">${h.descripcion ?? 'No indica'}</span></div>`;
                detalle.innerHTML += `<div class="field"><span class="field-label">Fecha del hecho:</span>
                    <span class="field-value">${h.fechaSuceso ? h.fechaSuceso : 'No indica'}</span></div>`;
                detalle.innerHTML += `<div class="field"><span class="field-label">Categorías:</span>
                    <span class="field-value">${h.categorias && h.categorias.length ? h.categorias.map(c=>`<span class="chip">${c}</span>`).join(' ')
                    : '<span class="muted">No indica</span>'}</span></div>`;
                detalle.innerHTML += `<div class="field"><span class="field-label">Etiquetas:</span>
                    <span class="field-value">${h.etiquetas && h.etiquetas.length ? h.etiquetas.map(e=>`<span class="chip">${e}</span>`).join(' ')
                    : '<span class="muted">No indica</span>'}</span></div>`;
                detalle.innerHTML += `<div class="field"><span class="field-label">Contribuyente:</span>
                    <span class="field-value">${h.contribuyente ?? 'No indica'}</span></div>`;
                if (h.multimedia && h.multimedia.length)
                    detalle.innerHTML += `<div class="field"><span class="field-label">Multimedia:</span>
                        <span class="field-value">${h.multimedia.map(m=>
                        `<a href="${m}" target="_blank" rel="noreferrer"><i class="fa-solid fa-link"></i>${m}</a>`
                    ).join('')}</span></div>`;
                detalle.innerHTML += `<div class="field" style="margin-top:0.6rem;">
                    <a href="#" class="btn-map js-ver-hecho" data-hash="${h.hash ?? ''}">
                        <i class="fa-solid fa-location-dot"></i> Ver hecho
                    </a>
                </div>`;
                detalle.innerHTML += `<div class="field" style="margin-top:0.6rem;">
                    <a class="btn-solicitud" href="/solicitudEliminacion/${h.hash ?? ''}">Solicitar eliminación</a>
                </div>`;

                detalles.appendChild(detalle);
                accordion.appendChild(detalles);

                const lat = parseFloat(h.latitud), lon = parseFloat(h.longitud);
                if (map && lat && lon) {
                    if (!p0) p0 = [lat, lon];
                    const popupHtml = `
                        <div class="popup-card">
                            <div class="popup-title"><b>${h.nombre ?? '(sin título)'}</b></div>
                            <a href="#" class="btn-map js-ver-hecho" data-hash="${h.hash ?? ''}">
                              <i class="fa-solid fa-list"></i> Ver hecho
                            </a>
                        </div>
                    `;
                    const m = L.marker([lat, lon]).addTo(map).bindPopup(popupHtml);
                    markersByHash[h.hash] = m;
                }
            });
            if (map && p0) map.setView(p0, 13);
        }
    </script>
</th:block>
</html>
