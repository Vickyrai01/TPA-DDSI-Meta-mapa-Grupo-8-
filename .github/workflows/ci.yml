name: Java CI (Build, Test, Checkstyle)

on:
  pull_request:
    branches: [ "main" ]  # Se ejecuta en PRs hacia main desde cualquier rama

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Paso 1: Compilación
      - name: Compile project
        run: mvn clean compile

      # Paso 2: Ejecución de tests (si existen)
      - name: Run tests
        run: mvn test

      # Paso 3: Validar Checkstyle (asumiendo que está configurado en el pom.xml)
      - name: Checkstyle validation
        run: mvn checkstyle:check
        continue-on-error: false  # Falla el workflow si hay errores de estilo
